name: Java CI (Ant)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build (Ant)
        run: |
          ant -f ChatApp/build.xml clean || true
          # Try common Ant targets. Adjust if your project uses different targets.
          if ant -f ChatApp/build.xml jar; then
            echo "Built jar"
          elif ant -f ChatApp/build.xml build; then
            echo "Built (build target)"
          else
            echo "Neither jar nor build target succeeded; attempting default target"
            ant -f ChatApp/build.xml || true
          fi

      - name: Run tests (if present)
        run: |
          if ant -f ChatApp/build.xml test; then
            echo "Tests ran"
          else
            echo "No test target or tests failed/are absent"
          fi
